# Roda os crawlers toda semana e publica os dados novos no site (GitHub Pages).
# Também pode ser executado na hora pela aba Actions > "Atualizar dados do site" > Run workflow.
name: Atualizar dados do site

on:
  schedule:
    - cron: '0 9 * * 1' # toda segunda-feira, 6h no horário de Brasília
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atualizar-dados
  cancel-in-progress: false

jobs:
  crawlers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Finanças (Tesouro Nacional / SICONFI)
        run: node crawler/financas/crawler_financas.js

      - name: Servidores (portal da prefeitura)
        run: php crawler/servidores/crawler_servidores.php

      - name: Publicar dados novos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "Nenhum dado novo."
          else
            git commit -m "Atualiza dados do site ($(date +%d/%m/%Y))"
            git push
          fi
